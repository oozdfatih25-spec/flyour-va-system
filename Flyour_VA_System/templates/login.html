<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap - Flyover VA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center vh-100">
    <div class="container" style="max-width: 400px;">
        <div class="card bg-secondary text-white p-4 shadow">
            <h3 class="text-center mb-3">Flyover VA Giriş</h3>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} p-2 mb-2">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label">Callsign</label>
                    <input type="text" name="callsign" class="form-control" placeholder="Örn: DISP001 veya FLY001" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Şifre</label>
                    <input type="password" name="password" class="form-control" placeholder="Şifreniz" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
            </form>
            <div class="mt-3 text-center">
                <a href="/register" class="text-white-50">Hesabın yok mu? Kayıt Ol</a>
            </div>
        </div>
    </div>
</body>
</html>
