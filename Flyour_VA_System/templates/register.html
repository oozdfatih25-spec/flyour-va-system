<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol - Flyover VA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center vh-100">
    <div class="container" style="max-width: 400px;">
        <div class="card bg-secondary text-white p-4 shadow">
            <h3 class="text-center mb-3">Flyover VA Kayıt</h3>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} p-2 mb-2">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="/register">
                <div class="mb-3">
                    <label class="form-label">Callsign</label>
                    <input type="text" name="callsign" class="form-control" placeholder="Örn: FLY002" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ad Soyad</label>
                    <input type="text" name="name" class="form-control" placeholder="Adınız Soyadınız" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Şifre</label>
                    <input type="password" name="password" class="form-control" placeholder="Şifre" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select name="role" class="form-select">
                        <option value="PILOT">Pilot</option>
                        <option value="DISPATCHER">Dispatcher (Yönetici)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100">Kayıt Ol</button>
            </form>
            <div class="mt-3 text-center">
                <a href="/login" class="text-white-50">Zaten hesabın var mı? Giriş Yap</a>
            </div>
        </div>
    </div>
</body>
</html>
