<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyour Virtual Airways - Pilot Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc !important; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { background: #1e293b; border: 1px solid #334155; border-radius: 12px; color: #f8fafc; }
        .navbar-custom { background: #1e293b; border-bottom: 1px solid #334155; }
        .btn-flyour { background-color: #0284c7; color: white; }
        .btn-flyour:hover { background-color: #0369a1; color: white; }
        .badge-rank { background-color: #38bdf8; color: #0f172a; font-weight: bold; }
        
        /* Tüm metinleri net beyaz yapma */
        label, .form-label, h1, h2, h3, h4, h5, h6, p, span, div, li, small { color: #f8fafc !important; }
        .text-muted { color: #94a3b8 !important; }
        
        /* Form Kutuları Renk Düzeltmeleri */
        .form-control {
            background-color: #0f172a !important;
            color: #ffffff !important;
            border: 1px solid #475569 !important;
        }
        .form-control:focus {
            background-color: #0f172a !important;
            color: #ffffff !important;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }
        input::placeholder {
            color: #64748b !important;
        }

        /* Tab Menü Stili */
        .nav-tabs .nav-link {
            color: #94a3b8 !important;
            border: none !important;
            font-weight: bold;
        }
        .nav-tabs .nav-link.active {
            color: #38bdf8 !important;
            background-color: transparent !important;
            border-bottom: 3px solid #38bdf8 !important;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4">
        <a class="navbar-brand fw-bold text-info" href="#"><i class="fa-solid fa-plane-departure me-2 text-info"></i>FLYOUR VA</a>
        <div class="ms-auto" id="navAuthSection">
            <!-- JS ile dinamik dolacak -->
        </div>
    </nav>

    <div class="container my-5">
        
        <!-- MİSAFİR GÖRÜNÜMÜ (GİRİŞ / KAYIT TABLARI) -->
        <div id="guestSection" class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-custom p-4 shadow-lg">
                    
                    <!-- TAB BAŞLIKLARI -->
                    <ul class="nav nav-tabs nav-justified mb-4" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginTabContent" type="button" role="tab"><i class="fa-solid fa-right-to-bracket me-2"></i>Giriş Yap</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerTabContent" type="button" role="tab"><i class="fa-solid fa-user-plus me-2"></i>Kayıt Ol</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="authTabsContent">
                        <!-- GİRİŞ FORMU -->
                        <div class="tab-pane fade show active" id="loginTabContent" role="tabpanel">
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label class="form-label">Pilot ID</label>
                                    <input type="text" id="loginPilotId" class="form-control" placeholder="Örn: FLYOUR001" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Şifre</label>
                                    <input type="password" id="loginPassword" class="form-control" placeholder="Şifreniz" required>
                                </div>
                                <button type="submit" class="btn btn-flyour w-100 fw-bold">Giriş Yap</button>
                            </form>
                        </div>

                        <!-- KAYIT FORMU -->
                        <div class="tab-pane fade" id="registerTabContent" role="tabpanel">
                            <form id="registerForm">
                                <div class="mb-3">
                                    <label class="form-label">Ad Soyad</label>
                                    <input type="text" id="regName" class="form-control" placeholder="Örn: Fatih Özdemir" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">E-Posta Adresi</label>
                                    <input type="email" id="regEmail" class="form-control" placeholder="Örn: pilot@flyour.com" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">İstediğiniz Pilot ID</label>
                                    <input type="text" id="regPilotId" class="form-control" placeholder="Örn: FLYOUR002" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Şifre</label>
                                    <input type="password" id="regPassword" class="form-control" placeholder="Şifreniz" required>
                                </div>
                                <button type="submit" class="btn btn-success w-100 fw-bold"><i class="fa-solid fa-user-check me-2"></i>Kayıt Ol</button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- PİLOT PANELİ (OTURUM AÇILINCA GÖRÜNÜR) -->
        <div id="userDashboard" class="d-none">
            
            <!-- PROFİL ÖZETİ -->
            <div class="row mb-4">
                <div class="col-md-12">
                    <div class="card card-custom p-4 d-flex flex-row align-items-center justify-content-between">
                        <div>
                            <h3 class="mb-1 text-info" id="userName">--</h3>
                            <p class="text-muted mb-0">Pilot ID: <span class="text-info fw-bold" id="userPilotId">--</span> | Rütbe: <span class="badge badge-rank" id="userRank">--</span></p>
                        </div>
                        <div class="text-end">
                            <h2 class="text-warning mb-0"><i class="fa-solid fa-clock me-2"></i><span id="userFlightHours">0.0</span> Sa</h2>
                            <small class="text-muted">Toplam Uçuş Saati</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                
                <!-- 1. UÇUŞ RAPORLAMA (UÇUŞ SAATİ OTOMATİK EKLENİR) -->
                <div class="col-md-6">
                    <div class="card card-custom p-4 h-100">
                        <h5 class="text-info"><i class="fa-solid fa-file-signature me-2"></i>Uçuş Raporla (PIREP)</h5>
                        <hr class="border-secondary">
                        <form id="flightReportForm">
                            <div class="mb-3">
                                <label class="form-label">Uçuş Kodu</label>
                                <input type="text" id="repFlightNum" class="form-control" placeholder="Örn: FO101" required>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label">Kalkış (ICAO)</label>
                                    <input type="text" id="repDep" class="form-control" placeholder="Örn: LTFM" required>
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label">Varış (ICAO)</label>
                                    <input type="text" id="repArr" class="form-control" placeholder="Örn: LTAI" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Uçuş Süresi (Saat)</label>
                                <input type="number" step="0.1" id="repTime" class="form-control" placeholder="Örn: 1.5" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold"><i class="fa-solid fa-paper-plane me-2"></i>Raporu Gönder & Saati İşle</button>
                        </form>
                    </div>
                </div>

                <!-- 2. BANA ATANAN ROTALAR VE ÖDÜLLERİM -->
                <div class="col-md-6">
                    <div class="card card-custom p-4 mb-4">
                        <h5 class="text-warning"><i class="fa-solid fa-route me-2"></i>Bana Atanan Görev / Rotalar</h5>
                        <hr class="border-secondary">
                        <ul class="list-group list-group-flush bg-transparent" id="myRoutesList">
                            <li class="list-group-item bg-transparent text-muted">Atanmış rota bulunmuyor.</li>
                        </ul>
                    </div>

                    <div class="card card-custom p-4">
                        <h5 class="text-warning"><i class="fa-solid fa-trophy me-2"></i>Başarılarım & Rozetlerim</h5>
                        <hr class="border-secondary">
                        <div id="myAchievementsList" class="d-flex flex-wrap gap-2">
                            <span class="text-muted">Henüz ödül tanımlanmadı.</span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 3. YÖNETİCİ (ADMIN) ÖZEL PANELİ - SADECE FLYOUR001 GÖRÜR -->
            <div id="adminPanel" class="row mt-5 d-none">
                <div class="col-md-12">
                    <div class="card card-custom p-4 border-warning">
                        <h4 class="text-warning"><i class="fa-solid fa-user-shield me-2"></i>Yönetici Paneli (FLYOUR001)</h4>
                        <hr class="border-secondary">
                        
                        <div class="row g-4">
                            <!-- ROTA ATAMA FORMU -->
                            <div class="col-md-6">
                                <h6><i class="fa-solid fa-plus-circle me-2 text-warning"></i>Pilota Rota Atama</h6>
                                <form id="adminAssignRouteForm">
                                    <div class="mb-2">
                                        <input type="text" id="admPilotId" class="form-control" placeholder="Hedef Pilot ID (Örn: FLYOUR002)" required>
                                    </div>
                                    <div class="mb-2">
                                        <input type="text" id="admFlightNum" class="form-control" placeholder="Uçuş Kodu (Örn: FO202)" required>
                                    </div>
                                    <div class="row g-2 mb-2">
                                        <div class="col-6"><input type="text" id="admDep" class="form-control" placeholder="Kalkış (LTFM)" required></div>
                                        <div class="col-6"><input type="text" id="admArr" class="form-control" placeholder="Varış (LTBJ)" required></div>
                                    </div>
                                    <div class="mb-2">
                                        <input type="text" id="admAircraft" class="form-control" placeholder="Uçak Tipi (A320 / B738)" required>
                                    </div>
                                    <button type="submit" class="btn btn-warning w-100 fw-bold">Rotayı Pilota Atayınız</button>
                                </form>
                            </div>

                            <!-- ÖDÜL VERME FORMU -->
                            <div class="col-md-6">
                                <h6><i class="fa-solid fa-award me-2 text-warning"></i>Pilota Rozet / Ödül Verme</h6>
                                <form id="adminGiveAwardForm">
                                    <div class="mb-2">
                                        <input type="text" id="admAwardPilotId" class="form-control" placeholder="Hedef Pilot ID (Örn: FLYOUR002)" required>
                                    </div>
                                    <div class="mb-2">
                                        <input type="text" id="admAwardTitle" class="form-control" placeholder="Ödül Başlığı (Örn: Gece Kuşu)" required>
                                    </div>
                                    <div class="mb-2">
                                        <input type="text" id="admAwardDesc" class="form-control" placeholder="Açıklama (Örn: 10 Gece uçuşu tamamlandı)" required>
                                    </div>
                                    <button type="submit" class="btn btn-warning w-100 fw-bold">Ödülü Tanımla</button>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sayfa Yüklenince Oturum Kontrolü
        document.addEventListener('DOMContentLoaded', checkAuth);

        function checkAuth() {
            fetch('/api/check-auth')
                .then(res => res.json())
                .then(data => {
                    if (data.authenticated) {
                        document.getElementById('guestSection').classList.add('d-none');
                        document.getElementById('userDashboard').classList.remove('d-none');
                        
                        // Bilgileri Doldur
                        document.getElementById('userName').innerText = data.user.name;
                        document.getElementById('userPilotId').innerText = data.user.pilot_id;
                        document.getElementById('userRank').innerText = data.user.rank;
                        document.getElementById('userFlightHours').innerText = data.user.flight_hours.toFixed(1);

                        // Navbar Butonu
                        document.getElementById('navAuthSection').innerHTML = `
                            <span class="text-light me-3">Hoş geldin, <b>${data.user.name}</b></span>
                            <button onclick="logout()" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-power-off me-1"></i>Çıkış</button>
                        `;

                        // Adminse Admin Panelini Aç
                        if(data.user.is_admin) {
                            document.getElementById('adminPanel').classList.remove('d-none');
                        }

                        // Verileri Yükle
                        loadMyRoutes();
                        loadMyAchievements();
                    } else {
                        document.getElementById('guestSection').classList.remove('d-none');
                        document.getElementById('userDashboard').classList.add('d-none');
                        document.getElementById('navAuthSection').innerHTML = '';
                    }
                });
        }

        // Giriş Yapma
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const pilot_id = document.getElementById('loginPilotId').value;
            const password = document.getElementById('loginPassword').value;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pilot_id, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    checkAuth();
                } else {
                    alert(data.message);
                }
            });
        });

        // Kayıt Olma
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pilot_id = document.getElementById('regPilotId').value;
            const password = document.getElementById('regPassword').value;

            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, pilot_id, password })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if (data.status === 'success') {
                    // Kayıt başarılı olunca giriş sekmesine yönlendir
                    const loginTab = new bootstrap.Tab(document.getElementById('login-tab'));
                    loginTab.show();
                    this.reset();
                }
            });
        });

        // Uçuş Raporlama (Saat Otomatik Ekleme)
        document.getElementById('flightReportForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const flight_number = document.getElementById('repFlightNum').value;
            const departure = document.getElementById('repDep').value;
            const arrival = document.getElementById('repArr').value;
            const flight_time = document.getElementById('repTime').value;

            fetch('/api/submit-flight', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ flight_number, departure, arrival, flight_time })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if (data.status === 'success') {
                    checkAuth(); // Saati ekranda güncelle
                    this.reset();
                }
            });
        });

        // Bana Atanan Rotaları Çek
        function loadMyRoutes() {
            fetch('/api/my-routes')
                .then(res => res.json())
                .then(routes => {
                    const list = document.getElementById('myRoutesList');
                    if (!routes || routes.length === 0) {
                        list.innerHTML = '<li class="list-group-item bg-transparent text-muted">Bana atanan aktif rota bulunmuyor.</li>';
                        return;
                    }
                    list.innerHTML = routes.map(r => `
                        <li class="list-group-item bg-transparent text-light border-secondary d-flex justify-content-between align-items-center">
                            <div>
                                <b class="text-info">${r.flight_number}</b>: ${r.departure} ➔ ${r.arrival}
                            </div>
                            <span class="badge bg-secondary">${r.aircraft}</span>
                        </li>
                    `).join('');
                });
        }

        // Başarıları / Ödülleri Çek
        function loadMyAchievements() {
            fetch('/api/my-achievements')
                .then(res => res.json())
                .then(ach => {
                    const box = document.getElementById('myAchievementsList');
                    if (!ach || ach.length === 0) {
                        box.innerHTML = '<span class="text-muted">Henüz ödül tanımlanmadı.</span>';
                        return;
                    }
                    box.innerHTML = ach.map(a => `
                        <div class="p-2 card-custom border-secondary rounded text-center">
                            <div style="font-size: 1.5rem;">${a.badge_icon}</div>
                            <small class="fw-bold d-block text-warning">${a.title}</small>
                            <small class="text-muted" style="font-size:0.75rem;">${a.description}</small>
                        </div>
                    `).join('');
                });
        }

        // ADMIN: Rota Atama
        document.getElementById('adminAssignRouteForm').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch('/api/admin/assign-route', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pilot_id: document.getElementById('admPilotId').value,
                    flight_number: document.getElementById('admFlightNum').value,
                    departure: document.getElementById('admDep').value,
                    arrival: document.getElementById('admArr').value,
                    aircraft: document.getElementById('admAircraft').value
                })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if(data.status === 'success') this.reset();
            });
        });

        // ADMIN: Ödül Verme
        document.getElementById('adminGiveAwardForm').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch('/api/admin/give-award', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pilot_id: document.getElementById('admAwardPilotId').value,
                    title: document.getElementById('admAwardTitle').value,
                    description: document.getElementById('admAwardDesc').value
                })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if(data.status === 'success') this.reset();
            });
        });

        // Çıkış
        function logout() {
            fetch('/api/logout', { method: 'POST' }).then(() => checkAuth());
        }
    </script>
</body>
</html>
