<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyour VA - Pilot Paneli</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0284c7">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#0f172a; color:#f8fafc; display:flex; height:100vh; overflow:hidden; }
        #auth-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; display:flex; align-items:center; justify-content:center; z-index:9999; }
        .auth-box { background:#1e293b; padding:35px; border-radius:16px; border:1px solid #334155; width:380px; text-align:center; box-shadow:0 10px 25px rgba(0,0,0,0.5); }
        .auth-tabs { display:flex; margin-bottom:20px; border-bottom:1px solid #334155; }
        .tab-btn { flex:1; padding:10px; background:none; border:none; color:#94a3b8; font-weight:bold; cursor:pointer; }
        .tab-btn.active { color:#38bdf8; border-bottom:2px solid #38bdf8; }
        .sidebar { width:270px; background:#1e293b; border-right:1px solid #334155; display:flex; flex-direction:column; padding:20px 12px; justify-content:space-between; z-index:10; }
        .brand { font-size:22px; font-weight:800; color:#38bdf8; text-align:center; margin-bottom:25px; display:flex; align-items:center; justify-content:center; gap:10px; }
        .menu-item { display:flex; align-items:center; gap:12px; padding:12px 16px; color:#94a3b8; border-radius:8px; margin-bottom:6px; font-size:14px; font-weight:600; cursor:pointer; transition:0.2s; }
        .menu-item:hover, .menu-item.active { background:#0284c7; color:white; }
        .main-content { flex:1; padding:30px; overflow-y:auto; }
        .page-section { display:none; }
        .page-section.active { display:block; }
        .card { background:#1e293b; border:1px solid #334155; border-radius:14px; padding:24px; margin-bottom:20px; }
        h2 { font-size:24px; color:#38bdf8; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        .grid-3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; }
        label { display:block; margin-bottom:6px; font-size:13px; color:#94a3b8; text-align:left; }
        input, select { width:100%; padding:12px; background:#0f172a; border:1px solid #334155; border-radius:8px; color:white; margin-bottom:12px; outline:none; }
        .btn-submit { background:#0284c7; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; width:100%; margin-top:5px; }
        #canvas-container { width:100%; height:450px; background:#090d16; border-radius:12px; border:1px solid #334155; }
    </style>
</head>
<body>
    <div id="auth-overlay">
        <div class="auth-box">
            <div class="brand" style="margin-bottom:15px;"><i class="fa-solid fa-plane-up"></i> FLYOUR VA</div>
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchAuth('login')">Giriş Yap</button>
                <button class="tab-btn" onclick="switchAuth('register')">Kayıt Ol</button>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)">
                <label>Pilot ID</label>
                <input type="text" id="login-id" placeholder="Örn: FLY101" required>
                <label>Şifre</label>
                <input type="password" id="login-pass" required>
                <button type="submit" class="btn-submit">Giriş Yap</button>
            </form>
            <form id="register-form" onsubmit="handleRegister(event)" style="display:none;">
                <label>Ad Soyad</label>
                <input type="text" id="reg-name" placeholder="Ahmet Yılmaz" required>
                <label>Pilot ID (Çağrı Kodu)</label>
                <input type="text" id="reg-id" placeholder="Örn: FLY101" required>
                <label>E-Posta</label>
                <input type="email" id="reg-email" required>
                <label>Şifre</label>
                <input type="password" id="reg-pass" required>
                <button type="submit" class="btn-submit" style="background:#10b981;">Kayıt Ol</button>
            </form>
        </div>
    </div>

    <div class="sidebar">
        <div>
            <div class="brand"><i class="fa-solid fa-plane-up"></i> FLYOUR VA</div>
            <div class="menu-item active" onclick="showPage('kartim', this)"><i class="fa-solid fa-id-card"></i> Kartım / Profil</div>
            <div class="menu-item" onclick="showPage('ucus-bilgilerim', this)"><i class="fa-solid fa-plane-departure"></i> Uçuş Bilgilerim</div>
            <div class="menu-item" onclick="showPage('ucus-planlama', this)"><i class="fa-solid fa-route"></i> Uçuş Planlama</div>
            <div class="menu-item" onclick="showPage('3d-filo', this)"><i class="fa-solid fa-cube"></i> 3D Filo</div>
            <div class="menu-item" onclick="showPage('ucus-raporu', this)"><i class="fa-solid fa-file-signature"></i> Uçuş Raporu (PIREP)</div>
        </div>
        <div class="menu-item" onclick="location.reload()" style="color:#ef4444;"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</div>
    </div>

    <div class="main-content">
        <div id="kartim" class="page-section active">
            <h2><i class="fa-solid fa-id-card"></i> Pilot Dijital Kimlik</h2>
            <div class="card grid-2">
                <div>
                    <p style="color:#94a3b8;font-size:12px;">PİLOT İSMİ</p>
                    <h3 id="p-name" style="font-size:22px;">-</h3>
                    <p style="color:#94a3b8;font-size:12px;margin-top:15px;">PİLOT ID</p>
                    <h4 id="p-id" style="color:#38bdf8;font-size:18px;">-</h4>
                    <p style="color:#94a3b8;font-size:12px;margin-top:15px;">RÜTBE</p>
                    <h5 id="p-rank" style="color:#10b981;font-size:16px;">-</h5>
                </div>
                <div style="border-left:1px solid #334155;padding-left:20px;">
                    <p style="color:#94a3b8;font-size:12px;">TOPLAM UÇUŞ SAATİ</p>
                    <h1 id="p-hours" style="color:#38bdf8;font-size:42px;">0.0 hrs</h1>
                </div>
            </div>
        </div>

        <div id="ucus-bilgilerim" class="page-section">
            <h2><i class="fa-solid fa-plane-departure"></i> Aktif Görev</h2>
            <div class="card grid-3">
                <div><label>Çağrı Kodu</label><h3 id="p-callsign">-</h3></div>
                <div><label>Uçak</label><h3>Airbus A350-1000</h3></div>
                <div><label>Rota</label><h3>LTFM - LTCE</h3></div>
            </div>
        </div>

        <div id="ucus-planlama" class="page-section">
            <h2><i class="fa-solid fa-route"></i> Uçuş Planlama</h2>
            <div class="card">
                <form onsubmit="event.preventDefault();alert('Plan Başarıyla Oluşturuldu!');">
                    <div class="grid-2">
                        <div><label>Kalkış (ICAO)</label><input type="text" value="LTFM"></div>
                        <div><label>Varış (ICAO)</label><input type="text" value="LTCE"></div>
                    </div>
                    <button class="btn-submit">Plana Kaydet</button>
                </form>
            </div>
        </div>

        <div id="3d-filo" class="page-section">
            <h2><i class="fa-solid fa-cube"></i> 3D Filo - Airbus A350</h2>
            <div class="card"><div id="canvas-container"></div></div>
        </div>

        <div id="ucus-raporu" class="page-section">
            <h2><i class="fa-solid fa-file-signature"></i> PIREP Gönder</h2>
            <div class="card">
                <form onsubmit="event.preventDefault();alert('PIREP Onaya Gönderildi!');">
                    <div class="grid-2">
                        <div><label>Blok Süresi</label><input type="text" placeholder="01:45"></div>
                        <div><label>İniş Dikey Hızı (fpm)</label><input type="number" placeholder="-140"></div>
                    </div>
                    <button class="btn-submit" style="background:#10b981;">Raporu Tamamla</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function switchAuth(t){
            if(t==='login'){
                document.getElementById('login-form').style.display='block';
                document.getElementById('register-form').style.display='none';
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.remove('active');
            }else{
                document.getElementById('login-form').style.display='none';
                document.getElementById('register-form').style.display='block';
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.remove('active');
            }
        }

        async function handleRegister(e){
            e.preventDefault();
            const res=await fetch('/api/register',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({
                    name:document.getElementById('reg-name').value,
                    pilot_id:document.getElementById('reg-id').value,
                    email:document.getElementById('reg-email').value,
                    password:document.getElementById('reg-pass').value
                })
            });
            const data=await res.json();
            alert(data.message);
            if(data.status==='success') switchAuth('login');
        }

        async function handleLogin(e){
            e.preventDefault();
            const res=await fetch('/api/login',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({
                    pilot_id:document.getElementById('login-id').value,
                    password:document.getElementById('login-pass').value
                })
            });
            const data=await res.json();
            if(data.status==='success'){
                document.getElementById('auth-overlay').style.display='none';
                document.getElementById('p-name').innerText=data.user.name;
                document.getElementById('p-id').innerText=data.user.pilot_id;
                document.getElementById('p-callsign').innerText=data.user.pilot_id;
                document.getElementById('p-rank').innerText=data.user.rank;
                document.getElementById('p-hours').innerText=data.user.flight_hours+' hrs';
            }else{
                alert(data.message);
            }
        }

        function showPage(p,e){
            document.querySelectorAll('.page-section').forEach(s=>s.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('active'));
            document.getElementById(p).classList.add('active');
            e.classList.add('active');
            if(p==='3d-filo'&&!window.tInit){
                init3D();
                window.tInit=true;
            }
        }

        function init3D(){
            const c=document.getElementById('canvas-container');
            const s=new THREE.Scene();
            s.background=new THREE.Color(0x090d16);
            const cam=new THREE.PerspectiveCamera(45,c.clientWidth/c.clientHeight,0.1,1000);
            cam.position.set(0,5,15);
            const r=new THREE.WebGLRenderer({antialias:true});
            r.setSize(c.clientWidth,c.clientHeight);
            c.appendChild(r.domElement);
            const ctrl=new THREE.OrbitControls(cam,r.domElement);
            const l=new THREE.DirectionalLight(0x38bdf8,1.5);
            l.position.set(10,20,10);
            s.add(l);
            s.add(new THREE.AmbientLight(0xffffff,0.8));
            const g=new THREE.Group();
            const b=new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.8,8,32),new THREE.MeshStandardMaterial({color:0xf8fafc}));
            b.rotation.z=Math.PI/2;
            g.add(b);
            const w=new THREE.Mesh(new THREE.BoxGeometry(10,0.1,2),new THREE.MeshStandardMaterial({color:0x0284c7}));
            g.add(w);
            s.add(g);
            function anim(){
                requestAnimationFrame(anim);
                g.rotation.y+=0.005;
                ctrl.update();
                r.render(s,cam);
            }
            anim();
        }
    </script>
</body>
</html>
